<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OpenAgent</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
<aside id="sidebar">
<div class="sb-header">
<h2>OpenAgent</h2>
<button id="btn-new" class="primary">+ 新建对话</button>
</div>
<div id="conv-list"></div>
<div class="sb-footer">
<button id="btn-settings">&#x2699; 设置</button>
</div>
</aside>
<main>
<div id="ch-header">
<select id="sel-provider"></select>
<select id="sel-model"></select>
</div>
<div id="chat-msgs">
<div class="welcome"><h1>OpenAgent</h1><p>选择模型开始对话</p></div>
</div>
<div id="input-area">
<textarea id="input-msg" rows="1" placeholder="输入消息... (Enter发送)"></textarea>
<button id="btn-send" disabled>发送</button>
</div>
</main>
</div>
<div id="modal" class="hide">
<div class="modal-box">
<div class="modal-hdr"><h3>设置</h3><button id="modal-close">&times;</button></div>
<div class="modal-bd">
<h4>API 密钥</h4>
<div id="api-key-list"></div>
<h4>参数</h4>
<label>温度: <input type="range" id="st-temp" min="0" max="2" step="0.1" value="0.3"> <span id="st-temp-v">0.3</span></label>
<label>最大Token: <input type="number" id="st-mt" value="4096"></label>
<h4>系统提示</h4>
<textarea id="st-sp" rows="3"></textarea>
</div>
<div class="modal-ft"><button id="btn-save" class="primary">保存</button></div>
</div>
</div>
<script src="/app.js?v=3e456121"></script>
</body>
</html>
